[package]
name = "inkdown"
version = "0.1.4"
description = "A small, offline Markdown reader and editor"
edition = "2021"

[lib]
name = "inkdown_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
